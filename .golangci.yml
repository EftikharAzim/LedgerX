version: "2"

run:
  timeout: 5m

linters:
  default: none
  exclusions:
    paths:
      # npm packages can ship Go sources that are not part of this service.
      - ^ledgerx-ui/node_modules/
  enable:
    - govet
    - staticcheck
    - ineffassign
    - errcheck
    - gosec
    - revive
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

